[project]
name = "rcv-analysis"
version = "0.1.0"
description = "Processes and analyzes election data to derive insights about ranked choice voting"
requires-python = ">=3.14.0"
readme = "README.md"
dependencies = [
    "jupyterlab",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "seaborn",
    "tables",
]

[dependency-groups]
dev = ["flake8"]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
